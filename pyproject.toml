[project]
name = "steves-dvd-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bokney" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
]

[project.scripts]
steves-dvd-database = "steves_dvd_database:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-testdox>=3.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
